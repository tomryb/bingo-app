name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    steps:
      - name: Check that the verified commit is still master
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          if [ "$latest" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $VERIFIED_SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.revision.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: "24"
      - name: Deploy and wait for verified production versions
        if: steps.revision.outputs.current == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/deploy.mts
